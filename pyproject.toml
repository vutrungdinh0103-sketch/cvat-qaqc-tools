# Cấu hình công cụ phát triển (lint/format). Cài deps: pip install -r requirements-dev.txt
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["reports", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PIE", "RUF"]
ignore = [
    # Tiếng Việt là ngôn ngữ chính của dự án -> không cảnh báo ký tự Unicode.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Test dùng tên hàm dài, fixture và assert -> nới một số quy tắc cho dễ đọc.
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["qaqc", "checker", "conftest"]
